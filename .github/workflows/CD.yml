name: CD

on:
  push:
    tags:
      - '**'

jobs:
  release:
    name: Release
    uses: access-nri/actions/.github/workflows/release-python-package.yml@davide/create-python-release-workflow
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
      ANACONDA_USERNAME: ${{ secrets.ANACONDA_USERNAME }}
    permissions:
      contents: write
    with:
      dry-run: true